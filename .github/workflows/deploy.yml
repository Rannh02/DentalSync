name: Build and Deploy to MonsterASP

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DentalSync/DentalSync.csproj

      - name: Build
        run: dotnet build DentalSync/DentalSync.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish DentalSync/DentalSync.csproj --configuration Release --output ./publish

      - name: FTP Deploy to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: site94771.siteasp.net
          username: site94771
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./publish/
          server-dir: /wwwroot/
